url: https://dmodverse.github.io/cppDE/

template:
  bootstrap: 5
  math-rendering: mathjax

navbar:
  structure:
    left: [intro, guide, methods, examples, reference, news]
    right: [search, dmod2, github]
  components:
    intro:
      text: Get started
      href: articles/cppDE.html
    guide:
      text: Guide
      menu:
      - text: "1. Model definition and solution"
        href: articles/guide-model.html
      - text: "2. Events, switches and forcings"
        href: articles/guide-events.html
      - text: "3. Sensitivities"
        href: articles/guide-sensitivities.html
      - text: "4. Reverse mode"
        href: articles/guide-reverse.html
      - text: "5. Steady states"
        href: articles/guide-steady-states.html
      - text: "6. Batches of conditions"
        href: articles/guide-batches.html
      - text: "7. Algebraic functions"
        href: articles/guide-functions.html
      - text: "8. SUNDIALS backend"
        href: articles/guide-cvode.html
      - text: "---"
      - text: "Installation and troubleshooting"
        href: articles/installation.html
    examples:
      text: Examples
      menu:
      - text: "Sensitivities across events, checked symbolically"
        href: articles/saltation.html
      - text: "Fitting magnetization dynamics"
        href: articles/fitCoPt.html
      - text: "---"
      - text: "Benchmarks"
        href: articles/benchmarks.html
    methods:
      text: Methods
      menu:
      - text: Overview and notation
        href: articles/methods-overview.html
      - text: Expression language
        href: reference/expressions.html
      - text: Code generation
        href: articles/methods-codegen.html
      - text: Stepping and error control
        href: articles/methods-stepping.html
      - text: Forward sensitivities
        href: articles/methods-forward.html
      - text: Events, switches and saltation
        href: articles/methods-events.html
      - text: "Reverse mode: the discrete adjoint"
        href: articles/methods-reverse.html
      - text: Events in reverse mode
        href: articles/methods-reverse-events.html
      - text: Grid and refinement of the sweep
        href: articles/methods-reverse-checks.html
      - text: "Second derivatives: forward over reverse"
        href: articles/methods-forward-reverse.html
      - text: cvode() and the CVODES adjoint
        href: articles/methods-cvode.html
      - text: Derivative directions of cppFUN()
        href: articles/methods-cppfun.html
      - text: Steady states by pseudo-transient continuation
        href: articles/methods-ptc.html
      - text: ---------
      - text: "Appendix: method coefficients"
        href: articles/methods-coefficients.html
    dmod2:
      text: dMod2
      href: https://dmodverse.github.io/dMod2/
      aria-label: dMod2, the modeling framework built on cppDE
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/dModverse/cppDE
      aria-label: GitHub

articles:
- title: Guide
  navbar: ~
  desc: Every entry point of cppDE, chapter by chapter, on small models.
  contents:
  - '`articles/guide-model`'
  - '`articles/guide-events`'
  - '`articles/guide-sensitivities`'
  - '`articles/guide-reverse`'
  - '`articles/guide-steady-states`'
  - '`articles/guide-batches`'
  - '`articles/guide-functions`'
  - '`articles/guide-cvode`'

- title: Installation
  navbar: ~
  desc: System requirements, the optional libraries, and how to diagnose a failing solve.
  contents:
  - '`articles/installation`'

- title: Methods
  desc: >
    What the generated code computes: code generation, integrators and
    step-size control, forward and reverse sensitivities, events, the CVODES
    backend and the derivatives of algebraic functions.
  contents:
  - '`articles/methods-overview`'
  - '`articles/methods-codegen`'
  - '`articles/methods-stepping`'
  - '`articles/methods-forward`'
  - '`articles/methods-events`'
  - '`articles/methods-reverse`'
  - '`articles/methods-reverse-events`'
  - '`articles/methods-reverse-checks`'
  - '`articles/methods-forward-reverse`'
  - '`articles/methods-cvode`'
  - '`articles/methods-cppfun`'
  - '`articles/methods-ptc`'
  - '`articles/methods-coefficients`'

- title: Examples
  navbar: ~
  desc: Worked applications beyond the Guide.
  contents:
  - '`articles/saltation`'
  - '`articles/fitCoPt`'

- title: Benchmarks
  navbar: ~
  desc: The two integrators compared on 43 problems, from the saved results of one run.
  contents:
  - '`articles/benchmarks`'

reference:
- title: Models
  desc: Generate and compile the solver of an ODE model, natively or against SUNDIALS CVODES.
  contents:
  - cppODE
  - cvode
  - expressions
  - compile

- title: Solving
  desc: Solve a compiled model with sensitivities, read forcings and solver statistics.
  contents:
  - solveODE
  - forcingValues
  - diagnostics

- title: Reverse mode
  desc: Control the backward sweep and free the checkpoints of a kept forward pass.
  contents:
  - adjointControl
  - releaseStore

- title: Batches of conditions
  desc: Many conditions of one model in one call, in parallel.
  contents:
  - solveODEBatch
  - prepareBatch
  - solveBatch

- title: Algebraic functions and steady states
  desc: Compiled algebraic functions with their derivatives, and steady states by pseudo-transient continuation.
  contents:
  - cppFUN
  - evaluateMany
  - ptc

- title: Setup
  desc: Check the toolchain and the optional libraries, build them, and manage threads and native symbols.
  contents:
  - codegenAvailable
  - batchAvailable
  - forkGuard
  - installLibs
  - clearNativeSymbols
