# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # skip_on_cran() still guards CRAN and R-hub; our own jobs opt in.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2
        id: pandoc
        continue-on-error: true

      # the Pandoc download off GitHub Releases returns a transient 504 often
      # enough to fail a run on its own; one retry clears it.
      - name: Retry Pandoc after a transient download failure
        if: steps.pandoc.outcome == 'failure'
        uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SymPy and point reticulate at it
        shell: bash
        run: |
          python -m pip install --upgrade pip sympy numpy
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # R on FlexiBLAS, with SymPy/SUNDIALS/KLU packaged: the only job that runs the
  # test suite, i.e. the generate -> compile -> dyn.load path.
  fedora:
    runs-on: ubuntu-latest

    name: fedora (R release, gcc/FlexiBLAS)

    container: fedora:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RETICULATE_PYTHON: /usr/bin/python3
      _R_CHECK_FORCE_SUGGESTS_: false
      NOT_CRAN: true
      CI: false

    steps:
      - name: Install system dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            R-core R-core-devel flexiblas-devel gcc-c++ make git which diffutils \
            python3 python3-sympy python3-numpy sundials-devel suitesparse-devel \
            qpdf ghostscript pandoc libcurl-devel openssl-devel libxml2-devel \
            libpng-devel libuv-devel glibc-langpack-en devscripts-checkbashisms

      - uses: actions/checkout@v5

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("reticulate", "rcmdcheck", "testthat", "spelling", "R.rsp", "knitr", "rmarkdown"), repos = "https://cloud.r-project.org", Ncpus = 4L)'

      - name: Session info
        run: |
          Rscript -e 'sessionInfo()' -e 'print(sessionInfo()$BLAS)' -e 'print(reticulate::py_config())'

      - name: Check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"), error_on = "warning", check_dir = "check")'

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-r-release-results
          path: check
