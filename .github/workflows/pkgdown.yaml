# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.ref }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # the reference examples and the articles generate code through SymPy,
      # as in R-CMD-check.yaml
      - name: Install SymPy and point reticulate at it
        shell: bash
        run: |
          python -m pip install --upgrade pip sympy numpy
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      # SUNDIALS and KLU, so that the cvode() examples and article chunks run
      - name: Install the optional solver libraries
        run: sudo apt-get update && sudo apt-get install -y libsundials-dev libsuitesparse-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # the articles run their models; the benchmarks article reads the saved
      # results in vignettes/articles/bench/ and measures nothing
      - name: Build the site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
